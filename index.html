<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap">
    <link rel="icon" href="./assets/logos/Group.png">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/overlay.css">
    <link rel="stylesheet" href="./styles.css">

    <title>Fotogram</title>
</head>

<body onload="init()">
    <header>
        <div class="header-content">
            <a href="https://github.com/Fabian-Burdick" target="_blank">
                <img src="./assets/logos/Group.png" alt="logo-fotogram">
                <p>Fotogram</p>
            </a>
        </div>
    </header>

    <main>
        <!--gallery-->
        <section class="gallery-section">
            <h1>Norwegen 2025</h1>

            <div id="content" class="album">
                <!--gallery rendered here-->
            </div>

        </section>
        <!--dialog-->
        <dialog id="dialogContent" class="overlay-section">
            <div>
                <header>
                    <div id="imgsNumbers"></div>
                    <button class="close-button" onclick="closeDialog()">X</button>
                </header>
                <div id="dialogImg">
                    <!--overlay Image rendered here-->
                </div>
                <div class="dialog-footer">
                    <button>
                        <img onclick="showPrevImg()" class="img-rotate" src="./assets/logos/Property 1=Default (1).png">
                    </button>
                    <div id="numbers" class="img-numbers">
                        <!--Imagecounter rendered here-->
                    </div>
                    <button>
                        <img onclick="showNextImg()" class="img-default"
                            src="./assets/logos/Property 1=Default (1).png">
                    </button>
                </div>
            </div>
        </dialog>
    </main>

    <footer>
        <a href="https://developer-akademie.teachable.com/">
            <img src="./assets/logos/Icon.png">
            <p>Developer<br>Akademie</p>
        </a>
        <p>&copy; 2023 Developer Akademie GmbH</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
