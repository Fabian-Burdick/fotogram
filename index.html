<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap">
    <link rel="icon" href="./assets/logos/Group.png">
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/overlay.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="script.js"></script>
    <title>Fotogram</title>
</head>

<body onload="init()">
    <header>
        <a href="https://google.de" target="_blank">
            <img src="./assets/logos/Group.png" alt="Logo">
            <p>Fotogram</p>
        </a>
    </header>

    <main>
        <!--Gallery-->
        <section class="gallery-section">
            <h1>Norwegen 2025</h1>
            <button id="content" class="album"></button>
        </section>
        <!--Dialog-->
        <dialog id="dialog-content" class="overlay-section d-none">
            <div class="dialog">
                <div class="dialog-header">
                    <p id="imgs-numbers"></p>
                    <button class="close-button" onclick="closeDialog()">X</button>
                </div>
                <div>
                    <img id="dialogImg" class="dialog-img">
                </div>
                <div class="dialog-footer">
                    <button>
                        <img onclick="showPrevImg()" class="img-rotate" src="./assets/logos/Property 1=Default (1).png">
                    </button>
                    <p id="numbers"></p>
                    <button>
                        <img onclick="showNextImg()" class="img-default"
                            src="./assets/logos/Property 1=Default (1).png">
                    </button>
                </div>
            </div>
        </dialog>
    </main>

    <footer>
        <nav><img src="./assets/logos/Logo.png"></nav>
        <p>&copy; 2023 Developer Akademie GmbH</p>
    </footer>
</body>

</html>
