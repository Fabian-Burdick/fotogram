<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="icon" href="./assets/logos/Group.png">
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/overlay.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="script.js"></script>
</head>

<body onload="init()">
    <header>
        <nav><img src="./assets/logos/Capa_1.png" alt="Capa_1"></nav>
    </header>

    <main>
        <!--Gallery-->
        <section class="gallery-section">
            <h1>Your personal photo album</h1>
            <div id="content" class="album"></div>
        </section>
        <!--Dialog-->
        <section id="dialog-content" class="overlay-section d-none">
            <div class="dialog">
                <div class="dialog-header">
                    <p>Alaska-810433_1280</p>
                    <p class="close-button" onclick="closeDialog()">X</p>
                </div>
                <div>
                    <img id="dialogImg" class="dialog-img">
                </div>
                <div class="dialog-footer">
                    <img onclick="showPrevImg()" class="img-rotate" src="/assets/logos/Property 1=Default (1).png">
                    <p id="numbers"></p>
                    <img onclick="showNextImg()" class="img-default" src="/assets/logos/Property 1=Default (1).png">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <nav><img src="./assets/logos/Logo.png"></nav>
        <p>&copy; 2023 Developer Akademie GmbH</p>
    </footer>
</body>

</html>
